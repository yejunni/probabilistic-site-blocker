<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>차단됨</title>
  <!-- 꾸미는 건 나중에. 지금은 동작 확인용 최소 스타일만 -->
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 60px; }
    #prob { font-size: 72px; font-weight: bold; margin: 0; }
    #info { color: #666; margin-bottom: 30px; }
    button { font-size: 16px; padding: 10px 20px; margin: 4px; cursor: pointer; }
    #result { font-size: 24px; font-weight: bold; min-height: 40px; margin: 20px 0; }
    .pass { color: green; }
    .fail { color: red; }
    #dev { margin-top: 60px; padding-top: 20px; border-top: 1px solid #ddd; color: #999; font-size: 13px; }
    #dev input { width: 50px; }

    /* 이용 시간 정하기 — 위에 +, 가운데 숫자, 아래에 - */
    #stepper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .step-row { display: flex; gap: 6px; }
    .step-row button { min-width: 58px; margin: 0; }

    .step-value { display: flex; align-items: baseline; gap: 4px; }
    #minutesInput {
      width: 110px;
      font-size: 34px;
      font-weight: bold;
      text-align: center;
    }

    #minutesHint { color: #666; font-size: 13px; min-height: 18px; }
    #startBtn { font-size: 18px; padding: 10px 28px; }
  </style>
</head>
<body>

  <p id="prob">--%</p>
  <p id="info">불러오는 중...</p>

  <!-- 시도 버튼 -->
  <button id="attemptBtn">시도하기</button>

  <!-- 설정 화면 열기 -->
  <div>
    <button id="settingsBtn" style="font-size: 13px; margin-top: 12px;">설정</button>
  </div>

  <!-- 판정 결과가 여기 표시된다 -->
  <div id="result"></div>

  <!-- 통과했을 때만 보이는 시간 정하기 -->
  <div id="durations" hidden>
    <p>몇 분 쓸까요?</p>

    <!--
      +1 / -1 버튼은 두지 않는다.
      숫자 입력칸에 원래 달린 화살표(↑↓)와 키보드 방향키가 그 일을 한다.
      min/max를 걸어뒀으므로 그 화살표도 범위를 넘지 않는다.
    -->
    <div id="stepper">
      <div class="step-row">
        <button data-step="5">+5</button>
        <button data-step="10">+10</button>
      </div>

      <!-- 직접 쳐 넣어도 되도록 입력칸으로 뒀다 -->
      <div class="step-value">
        <input id="minutesInput" type="number" min="1" value="10">
        <span>분</span>
      </div>

      <div class="step-row">
        <button data-step="-5">-5</button>
        <button data-step="-10">-10</button>
      </div>
    </div>

    <p id="minutesHint"></p>
    <button id="startBtn">시작하기</button>
  </div>

  <!-- 테스트용. 나중에 이 블록 통째로 지우면 된다 -->
  <div id="dev">
    <p>테스트용</p>
    <label>경과 <input id="devElapsed" type="number" value="80">분으로</label>
    <button id="devElapsedBtn">적용</button>
    &nbsp;&nbsp;
    <label>오늘 사용 <input id="devUsed" type="number" value="0">분으로</label>
    <button id="devUsedBtn">적용</button>
  </div>

  <!-- config.js를 먼저 불러와야 blocked.js에서 CONFIG를 쓸 수 있다 -->
  <script src="config.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
